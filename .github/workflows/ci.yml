name: CI

# Every job here is a BLOCKING gate. This tool emits commands people run against production
# cloud accounts, so a green CI has to mean something. Actions are pinned to commit SHAs rather
# than moving tags -- a tag can be repointed at new code after review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current. requires-python is >=3.10, so the floor must actually be tested --
        # claiming support for a version nothing runs on is an untested claim.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - name: Install
        run: pip install -e '.[dev]'
      - name: Install botocore for real-service-model verification
        # botocore is NOT a runtime dependency and must never become one -- the tool reads
        # service-model JSON from disk. It is installed here only so that
        # test_curated_recipes_match_real_aws_models runs instead of skipping. That test is
        # the one that catches a recipe written from a stale memory of the API.
        run: pip install botocore
      - name: Confirm the skipif-gated tests will actually RUN, not skip
        # Two suites are skipif-gated on external things being present, and both are the
        # strongest gates here: real-parser validation of generated HCL (needs tofu) and
        # recipe-vs-real-AWS-model verification (needs service models). A silent skip turns
        # either into a no-op while CI still reports green, so assert their preconditions.
        run: |
          command -v tofu >/dev/null || { echo "::error::tofu missing; HCL validation tests would silently skip"; exit 1; }
          tofu version
          python -c "import sys; sys.path.insert(0,'src'); from remgen.providers.aws import drift; d=drift.find_model_dir(); print('service models:', d); sys.exit(0 if d else 1)" \
            || { echo "::error::no AWS service models found; recipe-vs-API test would silently skip"; exit 1; }
      - name: Test suite
        # No -k narrowing, no -x. The tests you did not expect to be affected are the point.
        # -rs surfaces skip reasons; --strict-markers keeps a typo'd marker from silently
        # deselecting a test.
        run: pytest -v -rs --strict-markers
      - name: Assert nothing was skipped
        # A skip that appears later -- a new skipif, a missing optional tool -- would otherwise
        # reduce coverage invisibly. This is the check that noticed 1 skipped test in the first
        # CI run of this repo.
        run: |
          set -o pipefail
          pytest -rs 2>&1 | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::tests were skipped in CI; coverage is lower than it appears"
            grep -E 'SKIPPED' /tmp/pytest.out || true
            exit 1
          fi
          echo "no tests skipped"

  sample:
    name: Committed sample is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - run: pip install -e '.[dev]'
      - name: Install botocore so the run is not degraded
        # Without service models, `generate` prints an extra "could not be verified"
        # warning and the transcript legitimately differs. Installing them keeps the
        # comparison meaningful instead of forcing the check to tolerate two shapes.
        run: pip install botocore
      - name: Regenerate the sample and diff it against what is committed
        # examples/ is documentation that claims to be real output. Unlike prose, that
        # claim is mechanically checkable, so it is checked -- a sample that silently
        # describes an older version is worse than no sample, because a reader has no
        # way to tell. Only the timestamp is normalized; everything else must match
        # byte for byte, which also proves output stays deterministic.
        run: |
          set -euo pipefail
          awsremgen generate --findings examples/findings.sample.json \
            --out ./artifacts --safety-level caution -v > /tmp/sample-run.txt 2>&1
          # The generation timestamp is the only legitimate difference between two runs,
          # and it appears in four distinct forms: the .sh/.tf header, the manifest
          # field, the artifact README's prose line, and the console summary. Missing
          # one makes this check fail on every run for a reason that is not drift.
          norm() {
            sed -E 's/(# Generated: |"generated_at": "|v[0-9][0-9.]* on |-- generated )[0-9T:+-]+/\1TIMESTAMP/' "$1"
          }
          # Compared by path relative to the output root, not by basename: artifacts now
          # live in a per-cloud subdirectory, and two clouds may legitimately produce the
          # same filename under different directories. Matching on basename would compare
          # the wrong pair and report a false match.
          rel() { ( cd "$1" && find . -type f | sed 's|^\./||' | sort ); }
          fail=0
          for name in $(rel examples/sample-output); do
            fresh="artifacts/$name"
            if [ ! -f "$fresh" ]; then
              echo "::error::the run no longer produces $name, but it is committed under examples/sample-output/"
              fail=1
              continue
            fi
            if ! diff -u <(norm "examples/sample-output/$name") <(norm "$fresh"); then
              echo "::error::examples/sample-output/$name is stale. Regenerate it (see examples/README.md)."
              fail=1
            fi
          done
          for name in $(rel artifacts); do
            if [ ! -f "examples/sample-output/$name" ]; then
              echo "::error::the run now produces $name, which is not committed under examples/sample-output/"
              fail=1
            fi
          done
          if ! diff -u <(norm examples/sample-run.txt) <(norm /tmp/sample-run.txt); then
            echo "::error::examples/sample-run.txt no longer matches the real console output."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "committed sample matches a fresh run"
      - name: The committed sample really parses
        # The sample is the first thing a reader trusts, so it gets the same real-parser
        # treatment as generated output in the test suite. A substring check would pass
        # on a file that reads correctly and does not parse.
        run: |
          set -euo pipefail
          # Found recursively: artifacts sit under a per-cloud directory. A glob that no
          # longer matches would make this job pass having checked nothing, so the counts
          # below are asserted rather than assumed.
          mapfile -t shells < <(find examples/sample-output -name '*.sh' | sort)
          mapfile -t tfs < <(find examples/sample-output -name '*.tf' | sort)
          [ "${#shells[@]}" -gt 0 ] || { echo "::error::no .sh artifacts found to check"; exit 1; }
          [ "${#tfs[@]}" -gt 0 ] || { echo "::error::no .tf artifacts found to check"; exit 1; }
          for f in "${shells[@]}"; do bash -n "$f"; done
          i=0
          for f in "${tfs[@]}"; do
            work="/tmp/tfcheck$i"; i=$((i+1))
            mkdir -p "$work"; cp "$f" "$work/main.tf"
            cat > "$work/provider.tf" <<'EOF'
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = ">= 5.0"
              }
            }
          }

          provider "aws" {
            region = "us-east-1"
          }
          EOF
            ( cd "$work" && tofu fmt -check -no-color main.tf \
                && tofu init -no-color -backend=false >/dev/null \
                && tofu validate -no-color )
          done
          echo "sample artifacts parse and are canonically formatted"
      - name: The sample's account guard still refuses the wrong account
        # The examples/README.md claims this, so the claim is executed rather than
        # asserted. A stub `aws` reports a different account and logs any mutating
        # call; the script must exit non-zero having made none.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakebin
          printf '%s\n' '#!/usr/bin/env bash' \
            'if [ "$1" = "sts" ]; then echo 999999999999; exit 0; fi' \
            'echo "MUTATION: aws $*" >> /tmp/fakebin/calls.log' \
            'exit 0' > /tmp/fakebin/aws
          chmod +x /tmp/fakebin/aws
          : > /tmp/fakebin/calls.log
          mapfile -t shells < <(find examples/sample-output -name '*.sh' | sort)
          [ "${#shells[@]}" -gt 0 ] || { echo "::error::no .sh artifacts found; the guard check ran on nothing"; exit 1; }
          for f in "${shells[@]}"; do
            set +e
            PATH=/tmp/fakebin:$PATH bash "$f" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::$f ran to completion against the WRONG account; the guard did not fire"
              exit 1
            fi
          done
          if [ -s /tmp/fakebin/calls.log ]; then
            echo "::error::mutating aws calls were issued despite an account mismatch:"
            cat /tmp/fakebin/calls.log
            exit 1
          fi
          echo "account guard refuses the wrong account and issues no mutating calls"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - name: Formatting is canonical
        # Enforced so that formatting is never a review topic and cannot drift back.
        # `ruff format` reads line-length from [tool.ruff] whether or not the project
        # opts in, so leaving this unenforced meant `--check` was permanently red with
        # no way for a reader to tell a real finding from a tool the project ignores.
        # Fix locally with `ruff format .` -- it changes no behaviour and no generated
        # output; that was verified byte-for-byte against the committed sample.
        run: ruff format --check --diff .

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: bandit on shipped code
        # src/ only: asserts in tests are intentional, but an assert in runtime code is not a
        # guard -- `python -O` strips it, leaving the invariant unenforced in exactly the
        # optimized build where violating it does damage.
        run: bandit -q -r src/

  docs-refs:
    name: Docs references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every referenced repo file exists
        # Three source modules point at ROADMAP.md and the README links several docs. A dangling
        # reference is a real defect: it sends a reader looking for a rationale that isn't there.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          errs = []
          # 1. Files named from source comments/docstrings and from doc links.
          for f in ("README.md", "ROADMAP.md", "NOTICE.md", "CHANGELOG.md",
                    "CONTRIBUTING.md", "SECURITY.md", "LICENSE",
                    # The sample is documentation the README sends readers to, so a
                    # missing piece of it is a dangling reference like any other. Note
                    # that '.gitignore' contains 'artifacts/', which matches at any
                    # depth -- naming the sample directory that would have committed
                    # nothing while every doc still pointed at it.
                    "examples/README.md", "examples/findings.sample.json",
                    "examples/sample-run.txt"):
              if not pathlib.Path(f).exists():
                  errs.append(f"missing required file: {f}")
          sample = pathlib.Path("examples/sample-output")
          # rglob, not glob: artifacts live under a per-cloud directory now. A
          # non-recursive check would have reported this directory as empty.
          if not any(sample.rglob("*.sh")) or not any(sample.rglob("*.tf")):
              errs.append("examples/sample-output/ must contain committed .sh and .tf artifacts")
          for companion in ("README.md", "manifest.json"):
              if not (sample / companion).exists():
                  errs.append(f"examples/sample-output/ is missing {companion}")
          # 2. Relative markdown links in the docs must resolve, including from
          #    examples/ -- where the links are '../SECURITY.md' and so only resolve
          #    when checked relative to the linking document.
          for doc in list(pathlib.Path(".").glob("*.md")) + list(pathlib.Path("examples").glob("*.md")):
              text = doc.read_text()
              for target in re.findall(r'\]\((\.{0,2}/?[A-Za-z0-9_./-]+\.md)\)', text):
                  if not (doc.parent / target).resolve().exists():
                      errs.append(f"{doc}: broken link -> {target}")
          # 3. Any src file citing a doc must have that doc present.
          for py in pathlib.Path("src").rglob("*.py"):
              for ref in re.findall(r'\b([A-Z][A-Z0-9_]*\.md)\b', py.read_text()):
                  if not pathlib.Path(ref).exists():
                      errs.append(f"{py}: cites missing {ref}")
          # 4. Paths the docs point readers at must exist. Listed explicitly rather than
          #    scraped from the prose: a restructure renames the module *and* the mention
          #    of it, and a scraper would follow the docs into agreeing with themselves.
          for src_path in ("src/remgen/core/sources.py",
                           "src/remgen/providers/aws/recipes/curated.py",
                           "src/remgen/core/generators/__init__.py",
                           "src/remgen/core/provider.py",
                           "src/remgen/providers/aws/__init__.py"):
              if not pathlib.Path(src_path).exists():
                  errs.append(f"docs reference missing path: {src_path}")
          if errs:
              print("doc reference check FAILED:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print("all doc references resolve")
          PY

  claims:
    name: README claims match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Recipe count and safety-level split are not stale
        # The README states a recipe count and a per-level split. Those are exactly the kind of
        # number that silently rots the next time a recipe is added, turning documentation into
        # a confident false claim.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, "src")
          from collections import Counter
          from remgen.providers.aws.recipes.curated import RECIPES
          tiers = Counter(str(getattr(r.safety_tier, "value", r.safety_tier)) for r in RECIPES)
          readme = pathlib.Path("README.md").read_text()
          errs = []
          n = len(RECIPES)
          if f"ships **{n} recipes**" not in readme:
              errs.append(f"README does not state the real recipe count ({n})")
          if f"Of the {n} shipped recipes" not in readme:
              errs.append(f"README summary line does not state {n} recipes")
          for tier, count in tiers.items():
              if f"**{count} is `{tier}`**" not in readme and f"**{count} are `{tier}`**" not in readme:
                  errs.append(f"README does not state {count} recipe(s) at tier '{tier}'")
          if errs:
              print("README claim check FAILED:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print(f"README claims match: {n} recipes, tiers {dict(tiers)}")
          PY
