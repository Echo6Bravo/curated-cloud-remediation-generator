[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is named for the package it installs, and the package is the
# multi-cloud home: `remgen.core` plus one `remgen.providers.<cloud>` per cloud.
# The repository is `curated-cloud-remediation-generator` and the AWS command is
# `awsremgen`; three names for three different things, as with
# kubernetes/k8s/kubectl.
name = "remgen"
# Read from `remgen.__version__` rather than written here, so the version has one
# source of truth. It was written in both places, with nothing checking they
# agreed -- and the copy that stamps every generated artifact header is the one in
# the package, so the pair drifting would have made `pip show remgen` disagree
# with the artifacts it produced, silently and in the direction least likely to be
# noticed. `dynamic` is setuptools reading the module's assignment, not an import:
# `remgen/__init__.py` must therefore keep `__version__` a plain string literal.
dynamic = ["version"]
description = "Generates review-ready vendor-CLI and OpenTofu/Terraform remediation artifacts for a curated subset of Tenable Cloud Security cloud policies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tenable, Inc." }]
keywords = [
    "cloud-security",
    "remediation",
    "tenable",
    "cspm",
    "aws",
    "opentofu",
    "terraform",
]

# ---------------------------------------------------------------------------
# ZERO required runtime dependencies. Everything below is stdlib-only.
#
# Each provider verifies its recipes against that cloud's own published API
# definitions, read from disk rather than imported: the AWS provider reads the
# botocore service models that ship inside AWS CLI v2 (or an installed botocore,
# if present). Neither is a Python dependency. See remgen.providers.aws.drift.
# ---------------------------------------------------------------------------
dependencies = []

[project.optional-dependencies]
# Only needed to run the test suite and linters, never to use the tool.
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "bandit>=1.7,<2",
]

[project.scripts]
# One command per cloud, not one command with a --cloud flag: credentials, recipe
# coverage and API verification are all per cloud, so a single command would imply
# an estate-wide run that no single credential set can perform.
awsremgen = "remgen.providers.aws.cli:main"
# Installed before it shipped any recipe, which is what proved the shared pipeline is
# genuinely cloud-neutral -- an abstraction validated against one provider is a guess,
# and driving it with a second one found three defects in the shared code. It ships
# recipes now; coverage stays partial by design and `policies --unsupported` reports
# the gap.
azremgen = "remgen.providers.azure.cli:main"

[project.urls]
Homepage = "https://github.com/Echo6Bravo/curated-cloud-remediation-generator"
Issues = "https://github.com/Echo6Bravo/curated-cloud-remediation-generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "remgen.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

# Formatting is mechanical and enforced in CI (`ruff format --check`), so it is
# never a review topic. Declared explicitly, empty, rather than left to the
# default: `ruff format` reads line-length above whether or not this section
# exists, so its absence looked like an opt-out while the tool in fact had an
# opinion -- leaving `--check` permanently red with no way for a reader to tell
# whether that was a real finding or a tool the project does not use.
[tool.ruff.format]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
